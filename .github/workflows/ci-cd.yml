name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (default safe runtime)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          if [ -f package.json ]; then npm install; else echo "No Node project detected"; fi

      - name: Run tests
        run: |
          if [ -f package.json ]; then npm test --if-present; else echo "No tests found"; fi

      - name: Build project
        run: |
          if [ -f package.json ]; then npm run build --if-present; else echo "No build step"; fi

      - name: Upload build artifact (if exists)
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            dist
            build
            out
